          <figure class="epigraph">
            <blockquote cite="https://www.dezeen.com/2019/08/12/chloe-baines-in-tents-fashion-design/">
              <p>“I have always been very critical of using lots of colour in my work ... But in utilising the existing colours of the tents I have come to really enjoy the vibrancy ... after a lot of experimentation, I stopped trying to change too much of the existing finishes within each tent and started allowing their existing elements to inspire new designs.”</p>
            </blockquote>
            <figcaption>Chloe Baines, <cite><a href="https://www.dezeen.com/2019/08/12/chloe-baines-in-tents-fashion-design/">interview with Dezeen</a></cite></figcaption>

                     loading="lazy" decoding="async"
                     alt="A quilt of close-up photographs showing Chloe Baines’s colourful woven, laced, and repurposed textile garments.">
              </button>
            </li>
          </ul>

        <aside class="margin-notes" aria-label="Research margin notes">
