    <section>
      <details class="project-section">
        <summary><h2 class="project-section-heading">Research</h2></summary>
      <div class="int-grid"></div>
      </details>
    </section>

    <section>
      <details class="project-section">
        <summary><h2 class="project-section-heading">Process</h2></summary>
      <div class="int-grid">

        <figure class="int-fig" style="--col: 3 / 11; --col-m: 1 / -1; --w: 1800px">
          <button type="button" class="int-shot"
                  data-full="images/diorama-01-brainstorm-full.jpg"
                  data-caption="Initial ideas and brainstorming in my sketchbook">
            <img src="images/diorama-01-brainstorm-thumb.jpg"
                 srcset="images/diorama-01-brainstorm-thumb.jpg 800w, images/diorama-01-brainstorm-full.jpg 1800w"
                 sizes="(min-width: 760px) 67vw, 100vw"
                 width="800" height="911" loading="lazy" decoding="async"
                 alt="Sketchbook pages of brainstorming notes in pink pen: ideas for a diorama of an artist’s studio and an anatomy theatre, materials such as glass and plexiglass for transparency, references to Do Ho Suh, Louise Bourgeois’s Cells, Poetics of Space, Giulio Camillo’s Theatre of Memory and Ettore Sottsass, and small sketches of domes, arches and gridded boxes around the idea of inner and outer, circle versus rectilinear.">
          </button>
          <figcaption>Initial ideas and brainstorming in my sketchbook</figcaption>
        </figure>

        <aside class="int-note" style="--col: 2 / 6; --col-m: 1 / 13; --align: end">
          <p>I wanted a checkered floor. The glue made the paper wet and it started to lift and ripple. I’ll come up with a solution, or a way to use the effect later.</p>
        </aside>

        <figure class="int-fig" style="--col: 6 / 13; --col-m: 3 / 13; --w: 1800px">
          <button type="button" class="int-shot"
                  data-full="images/diorama-02-checkered-floor-full.jpg"
                  data-caption="Progress: the checkered floor of the diorama, lifting where the glue made it wet">
            <img src="images/diorama-02-checkered-floor-thumb.jpg"
                 srcset="images/diorama-02-checkered-floor-thumb.jpg 800w, images/diorama-02-checkered-floor-full.jpg 1800w"
                 sizes="(min-width: 760px) 58vw, 84vw"
                 width="800" height="600" loading="lazy" decoding="async"
                 alt="Close-up of a checkered floor of grey and white paper squares glued to a board, the glossy wet surface rippling into raised wavy ridges.">
          </button>
          <figcaption>Progress: the checkered floor, lifting where the glue made it wet</figcaption>
        </figure>

      </div>
      </details>
